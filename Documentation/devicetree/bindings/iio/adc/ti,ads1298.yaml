%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/ti,ads1298.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments ADS1298/ADS1299 biopotential ADC chips

description: |
  ADS1298/ADS1298R: 8-channel, 24-bit ECG ADC. Max 12x PGA gain.
  Datasheet: https://www.ti.com/product/ADS1298

  ADS1299: 4/6/8-channel, 24-bit EEG/biopotential ADC. Max 24x PGA gain.
  Channel count is discoverable from the ID register at runtime.
  Datasheet: https://www.ti.com/product/ADS1299

maintainers:
  - Mike Looijmans <mike.looijmans@topic.nl>

properties:
  compatible:
    enum:
      - ti,ads1298
      - ti,ads1299

  reg:
    maxItems: 1

  spi-cpha: true

  reset-gpios:
    maxItems: 1

  avdd-supply:
    description:
      Analog power supply, voltage between AVDD and AVSS. When providing a
      symmetric +/- 2.5V, the regulator should report 5V.

  vref-supply:
    description:
      Optional reference voltage. If omitted, internal reference is used.

  clocks:
    description: Optional 2.048 MHz external source clock on CLK pin
    maxItems: 1

  interrupts:
    description: Interrupt on DRDY pin, triggers on falling edge
    maxItems: 1

  label: true

required:
  - compatible
  - reg
  - avdd-supply
  - interrupts

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@1 {
          reg = <1>;
          compatible = "ti,ads1298";
          label = "ads1298-1-ecg";
          avdd-supply = <&reg_iso_5v_a>;
          clocks = <&clk_ads1298>;
          interrupt-parent = <&gpio0>;
          interrupts = <78 IRQ_TYPE_EDGE_FALLING>;
          spi-max-frequency = <20000000>;
          spi-cpha;
        };

    };
...
